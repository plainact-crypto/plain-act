name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install main site dependencies
        run: npm install --no-audit --no-fund

      - name: Build Plain Act site
        run: npm run build

      - name: Build chess trainer with production patches
        working-directory: chess-opening-trainer
        run: bash cloudflare-build.sh

      - name: Deep audit Rank Test source
        working-directory: chess-opening-trainer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('src/main.js').read_text()
          targets=['reset','onBoardInput','startRankTest','startRankRound','prepareRankUserTurn','scoreRankMoveAndContinue','finishRankRound','finishRankTest','completeHTML','renderTraining','renderRankReview','renderRankMistakeReview']
          def function_chunk(name):
              m=re.search(r'(?m)^(?:async\s+)?function\s+'+re.escape(name)+r'\s*\(',s)
              if not m: return None
              nxt=re.search(r'(?m)^\s*(?:async\s+)?function\s+[A-Za-z_$][\w$]*\s*\(',s[m.end():])
              end=m.end()+nxt.start() if nxt else min(len(s),m.start()+10000)
              return s[m.start():min(end,m.start()+12000)]
          for name in targets:
              chunk=function_chunk(name)
              if chunk is None:
                  msg='NOT FOUND'
              else:
                  msg=chunk.replace('%','%25').replace('\r',' ').replace('\n','%0A')
              print(f'::notice title=RankDeep {name}::{msg}')
          # Also expose rank-mode assignment and click wiring around startRankTest.
          for label,pat in [('mode-assignment',r'.{0,900}state\.mode\s*=\s*[\"\']rank[\"\'].{0,1600}'),('rank-click',r'.{0,1200}startRankTest\s*\(.{0,1800}')]:
              m=re.search(pat,s,re.S|re.I)
              msg=(m.group(0) if m else 'NOT FOUND').replace('%','%25').replace('\r',' ').replace('\n','%0A')
              print(f'::notice title=RankDeep {label}::{msg}')
          PY

      - name: Add chess trainer to Pages artifact
        run: |
          rm -rf dist/chess-opening-trainer
          mkdir -p dist/chess-opening-trainer
          cp -R chess-opening-trainer/dist/. dist/chess-opening-trainer/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

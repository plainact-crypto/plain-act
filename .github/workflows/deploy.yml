name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install main site dependencies
        run: npm install --no-audit --no-fund

      - name: Build Plain Act site
        run: npm run build

      - name: Restore chess trainer source
        run: |
          cat chess-opening-trainer/source.b64.* > /tmp/chess-source.b64
          base64 -d /tmp/chess-source.b64 > /tmp/chess-source.zip
          unzip -o /tmp/chess-source.zip -d chess-opening-trainer || true
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('chess-opening-trainer/src/main.js')
          s=p.read_text()
          if 'const APP_BASE =' not in s:
              s=s.replace('const app = document.querySelector("#app");','const app = document.querySelector("#app");\nconst APP_BASE = import.meta.env.BASE_URL || "/";')
          s=s.replace('assetsUrl:"/cm-chessboard/"','assetsUrl:`${APP_BASE}cm-chessboard/`')
          s=s.replace('assetsUrl:"/cm-chessboard/assets/"','assetsUrl:`${APP_BASE}cm-chessboard/`')

          # Keep the old report function available for rollback, and inject the
          # verifiable GitHub issue reporter that records the complete game.
          if 'function openIssueReportLegacy()' not in s:
              patched, count = re.subn(r'function\s+openIssueReport\s*\(\s*\)\s*\{', 'function openIssueReportLegacy(){', s, count=1)
              if count != 1:
                  raise SystemExit('Could not locate openIssueReport() for telemetry patch')
              s = patched
          patch = Path('chess-opening-trainer/issue-report-patch.js').read_text()
          if 'const ISSUE_REPORT_REPO = "plainact-crypto/plain-act";' not in s:
              s += '\n' + patch + '\n'
          p.write_text(s)

          p=Path('chess-opening-trainer/src/core/engine.js')
          s=p.read_text().replace('constructor(workerUrl="/stockfish/stockfish-18-lite-single.js"){','constructor(workerUrl=`${import.meta.env.BASE_URL || "/"}stockfish/stockfish-18-lite-single.js`){')
          p.write_text(s)
          PY

      - name: Install chess trainer dependencies
        working-directory: chess-opening-trainer
        run: npm install --no-audit --no-fund

      - name: Build chess trainer
        working-directory: chess-opening-trainer
        run: npm run build

      - name: Add chess trainer to Pages artifact
        run: |
          rm -rf dist/chess-opening-trainer
          mkdir -p dist/chess-opening-trainer
          cp -R chess-opening-trainer/dist/. dist/chess-opening-trainer/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

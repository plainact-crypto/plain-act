name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install main site dependencies
        run: npm install --no-audit --no-fund

      - name: Build Plain Act site
        run: npm run build

      - name: Build chess trainer with production patches
        working-directory: chess-opening-trainer
        run: bash cloudflare-build.sh

      - name: Audit Rank review board
        working-directory: chess-opening-trainer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('src/main.js').read_text()
          def notice(title,text):
              text=(text or 'NOT FOUND').replace('%','%25').replace('\r',' ').replace('\n','%0A')
              print(f'::notice title={title}::{text[:16000]}')
          for label,pat in [
              ('render-review-decl',r'(?:async\s+)?function\s+renderRankReview\s*\([^)]*\)\s*\{'),
              ('render-review-assign',r'renderRankReview\s*=\s*(?:async\s*)?function\s*\([^)]*\)\s*\{'),
              ('review-index',r'rankReviewIndex'),
              ('best-uci',r'bestUci'),
              ('review-board',r'rank-review|rankReviewBoard|reviewBoard')]:
              m=re.search(pat,s,re.I)
              if not m: notice('RankBoard '+label,None); continue
              notice('RankBoard '+label,s[max(0,m.start()-1200):min(len(s),m.start()+12000)])
          PY

      - name: Add chess trainer to Pages artifact
        run: |
          rm -rf dist/chess-opening-trainer
          mkdir -p dist/chess-opening-trainer
          cp -R chess-opening-trainer/dist/. dist/chess-opening-trainer/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install main site dependencies
        run: npm install --no-audit --no-fund

      - name: Build Plain Act site
        run: npm run build

      - name: Build chess trainer with production patches
        working-directory: chess-opening-trainer
        run: bash cloudflare-build.sh

      - name: Audit Rank results and retraining
        working-directory: chess-opening-trainer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('src/main.js').read_text()
          def notice(title,text):
              text=(text or 'NOT FOUND').replace('%','%25').replace('\r',' ').replace('\n','%0A')
              print(f'::notice title={title}::{text[:12000]}')
          def func(name):
              m=re.search(r'(?m)^(?:async\s+)?function\s+'+re.escape(name)+r'\s*\(',s)
              if not m:return None
              nxt=re.search(r'(?m)^\s*(?:async\s+)?function\s+[A-Za-z_$][\w$]*\s*\(',s[m.end():])
              end=m.end()+nxt.start() if nxt else min(len(s),m.start()+12000)
              return s[m.start():min(end,m.start()+12000)]
          for name in ['setupRankRound','render','renderRankSummary','rankSummaryHTML','startSavedTraining','openLevel']:
              notice('RankFinal '+name,func(name))
          for label,needle in [
              ('review-copy','Review Mistakes'),('retrain-copy','Train This'),
              ('review-index','rankReviewIndex'),('review-items','reviewItems'),
              ('rank-summary-screen','rankSummary')]:
              hits=[m.start() for m in re.finditer(re.escape(needle),s,re.I)]
              if not hits: notice('RankFinal '+label,None);continue
              chunks=[]
              for pos in hits[:6]: chunks.append(s[max(0,pos-1200):min(len(s),pos+3500)])
              notice('RankFinal '+label,'\n---HIT---\n'.join(chunks))
          PY

      - name: Add chess trainer to Pages artifact
        run: |
          rm -rf dist/chess-opening-trainer
          mkdir -p dist/chess-opening-trainer
          cp -R chess-opening-trainer/dist/. dist/chess-opening-trainer/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

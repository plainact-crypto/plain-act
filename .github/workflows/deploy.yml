name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install main site dependencies
        run: npm install --no-audit --no-fund

      - name: Build Plain Act site
        run: npm run build

      - name: Build chess trainer with production patches
        working-directory: chess-opening-trainer
        run: bash cloudflare-build.sh

      - name: Audit Rank Test source
        working-directory: chess-opening-trainer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('src/main.js').read_text()
          names=[]
          for m in re.finditer(r'(?i)(?:async\s+)?function\s+([A-Za-z_$][\w$]*rank[\w$]*)\s*\(',s):
              names.append((m.group(1),m.start()))
          for token in ['startRank','finishRank','rankSummary','rankPendingReview','rankReviewItems','rankBestMove','rankFreshBranchPending','mode="rank"',"mode='rank'"]:
              for m in re.finditer(re.escape(token),s,re.I):
                  names.append((token,m.start()))
          seen=set();out=[]
          for name,pos in sorted(names,key=lambda x:x[1]):
              key=(name,pos//250)
              if key in seen: continue
              seen.add(key)
              start=max(0,pos-500);end=min(len(s),pos+2500)
              snippet=s[start:end].replace('%','%25').replace('\r',' ').replace('\n','%0A')
              out.append((name,snippet))
          if not out:
              raise SystemExit('No Rank Test source markers found')
          for i,(name,snippet) in enumerate(out[:20],1):
              print(f'::notice title=RankAudit {i} {name}::{snippet}')
          print(f'Rank audit markers: {len(out)}')
          PY

      - name: Add chess trainer to Pages artifact
        run: |
          rm -rf dist/chess-opening-trainer
          mkdir -p dist/chess-opening-trainer
          cp -R chess-opening-trainer/dist/. dist/chess-opening-trainer/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

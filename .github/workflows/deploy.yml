name: Deploy Astro site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install main site dependencies
        run: npm install --no-audit --no-fund

      - name: Build Plain Act site
        run: npm run build

      - name: Build chess trainer with production patches
        id: chess_build
        continue-on-error: true
        working-directory: chess-opening-trainer
        run: bash cloudflare-build.sh

      - name: Add chess trainer to Pages artifact when build succeeds
        if: steps.chess_build.outcome == 'success'
        run: |
          rm -rf dist/chess-opening-trainer
          mkdir -p dist/chess-opening-trainer
          cp -R chess-opening-trainer/dist/. dist/chess-opening-trainer/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  activation-smoke:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser smoke dependency
        working-directory: chess-opening-trainer
        run: npm install --no-save --no-package-lock playwright

      - name: Install Chromium
        working-directory: chess-opening-trainer
        run: npx playwright install --with-deps chromium

      - name: Production activation smoke — Desktop + Mobile
        working-directory: chess-opening-trainer
        env:
          PRODUCTION_URLS: https://plainact-crypto.github.io/plain-act/chess-opening-trainer/,https://chess-opening-trainer-3jh.pages.dev
        run: node scripts/production-activation-smoke.mjs

      - name: Production training performance — Mobile
        working-directory: chess-opening-trainer
        env:
          PRODUCTION_URLS: https://plainact-crypto.github.io/plain-act/chess-opening-trainer/,https://chess-opening-trainer-3jh.pages.dev
        run: node scripts/production-performance-smoke.mjs

# Plain Act site deployment must not be blocked by an unrelated chess build failure.
# Any push to main intentionally triggers this pipeline; Cloudflare Pages should also auto-deploy from its GitHub integration when connected to main.
